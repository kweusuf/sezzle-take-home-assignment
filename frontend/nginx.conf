# Serves the built SPA and proxies the API, so the browser stays same-origin
# (the same reason the Vite dev server proxies /api in development).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so a restarted backend is re-resolved instead of
    # leaving nginx pointed at a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # One health endpoint for the whole stack.
    location = /health {
        proxy_pass $api/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown paths load the app instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
